name: smart_appbar
description: A powerful and intelligent SmartAppBar widget for Flutter that automatically adapts to routes, supports multiple visual variants, and provides seamless Material 3 design experience.
version: 1.0.0
homepage: https://github.com/yourusername/smart_appbar
repository: https://github.com/yourusername/smart_appbar
issue_tracker: https://github.com/yourusername/smart_appbar/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

topics:
  - appbar
  - smart
  - adaptive
  - material3
  - ui
  - widget
  - flutter
  - flutter-package