name: smart_appbar
description: Intelligent SmartAppBar widget for Flutter with 6 visual variants, automatic route adaptation, and Material 3 design.
version: 1.0.3
repository: https://github.com/manar42/SmartAppBar-

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

topics:
  - appbar
  - smart
  - adaptive
  - material3
  - ui
